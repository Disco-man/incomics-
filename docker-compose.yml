

services:
  # ── PostgreSQL ──────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: comix_postgres
    restart: unless-stopped
    profiles: ["dev"]
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: comix_db
      POSTGRES_USER: comix_user
      POSTGRES_PASSWORD: comix_secret_2026
    volumes:
      - comix_pgdata:/var/lib/postgresql/data
      - ./backend/src/config/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comix_user -d comix_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ─────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: comix_api
    restart: unless-stopped
    profiles: ["dev"]
    ports:
      - "3333:3333"
    environment:
      PORT: 3333
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: comix_db
      DB_USER: comix_user
      DB_PASSWORD: comix_secret_2026
      JWT_SECRET: comix_jwt_secret_key_2026
      CORS_ORIGIN: http://localhost:8100
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - ./backend/src:/app/src
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  # ── Frontend Web ────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: comix_web
    restart: unless-stopped
    profiles: ["dev"]
    ports:
      - "8100:8100"
    environment:
      VITE_API_URL: http://localhost:3333/api
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
    depends_on:
      - api

volumes:
  comix_pgdata:
    driver: local
